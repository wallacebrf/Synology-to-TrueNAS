services:
  chromium:
    environment:
      CUSTOM_USER: user
      PASSWORD: password
      PGID: 3000
      PUID: 3000
      TITLE: Chromium
      TZ: Chicago
    image: ghcr.io/linuxserver/chromium:latest
    network_mode: container:gluetun
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    shm_size: 1g
    volumes:
      - /mnt/volume1/apps/chromium:/config:rw
